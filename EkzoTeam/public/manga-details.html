<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المانجا - Ekzo Manga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-darkbg text-gray-100 font-cairo">

    <!-- Simple navbar include via copy style -->
    <nav class="bg-cardbg/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-700">
        <div class="container mx-auto px-4 py-3 flex items-center">
            <div class="flex-none mr-4">
                <a href="index.html" class="flex items-center gap-3 group">
                    <img src="images/logo.jpg" alt="Ekzo Team" class="h-10 w-auto object-contain">
                    <span class="text-xl font-black text-primary tracking-wider uppercase">EkzoManga</span>
                </a>
            </div>
            <div class="flex-1 text-center hidden md:block">
                <div class="inline-flex gap-6 text-sm font-semibold">
                    <a href="index.html" class="text-primary">الرئيسية</a>
                    <a href="articles.html" class="hover:text-primary">المقالات</a>
                    <a href="contact.html" class="hover:text-primary">تواصل معنا</a>
                </div>
            </div>
            <div class="flex-none ml-4" id="auth-buttons-container">
                <a href="/auth/google" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-bold">تسجيل
                    الدخول</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-10">
        <div id="manga-root" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <section class="md:col-span-2">
                <div id="manga-card" class="bg-cardbg rounded-xl p-6 shadow-lg">
                    <div class="flex gap-6">
                        <img id="manga-cover" src="https://via.placeholder.com/220x330"
                            class="w-40 h-56 object-cover rounded">
                        <div>
                            <h1 id="manga-title" class="text-2xl font-bold">عنوان المانجا</h1>
                            <p id="manga-author" class="text-gray-400 mt-2">بواسطة -</p>
                            <p id="manga-desc" class="text-gray-300 mt-4 text-sm"></p>
                            <div class="mt-4 flex gap-3">
                                <button id="fav-btn" class="bg-primary text-black px-4 py-2 rounded font-bold">أضف
                                    للمفضلة</button>
                                <a id="read-first" href="#chapters" class="bg-white/5 px-4 py-2 rounded">الفصول</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="chapters" class="mt-6 bg-cardbg rounded-xl p-6 shadow-lg">
                    <h3 class="font-bold text-lg mb-4">الفصول</h3>
                    <ul id="chapters-list" class="space-y-3 text-sm text-gray-300"></ul>
                </div>

                <div id="comments-section" class="mt-6 bg-cardbg rounded-xl p-6 shadow-lg">
                    <h3 class="font-bold text-lg mb-4">التعليقات</h3>
                    <div id="comment-form-wrap" class="mb-4">
                        <textarea id="comment-input" placeholder="اكتب تعليقاً..."
                            class="w-full bg-darkbg border border-gray-700 rounded px-4 py-3 text-sm"></textarea>
                        <div class="mt-2 flex gap-2 justify-start">
                            <button id="post-comment"
                                class="bg-primary text-black px-4 py-2 rounded font-bold">نشر</button>
                        </div>
                    </div>
                    <div id="comments-list" class="space-y-4 text-sm"></div>
                </div>
            </section>

            <aside class="md:col-span-1">
                <div class="bg-cardbg rounded-xl p-4 shadow-lg">
                    <h4 class="font-bold mb-3">روابط سريعة</h4>
                    <a href="https://x.com/EkzoTeam" target="_blank" class="block mb-2">𝕏</a>
                    <a href="https://discord.gg/QtZy3yyU" target="_blank" class="block mb-2">ديسكورد</a>
                    <a href="https://t.me/EkzoTeam0" target="_blank" class="block mb-2">تيليجرام</a>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadManga() {
            try {
                const resp = await fetch('/manga/' + id);
                if (!resp.ok) throw new Error('Manga not found');
                const manga = await resp.json();
                document.getElementById('manga-cover').src = manga.coverImage || 'https://via.placeholder.com/220x330';
                document.getElementById('manga-title').textContent = manga.title;
                document.getElementById('manga-author').textContent = 'بواسطة ' + (manga.author || manga.uploadedBy?.displayName || '-');
                document.getElementById('manga-desc').textContent = manga.description || '';

                // chapters
                const chResp = await fetch('/manga/' + id + '/chapters');
                if (chResp.ok) {
                    const chapters = await chResp.json();
                    const list = document.getElementById('chapters-list');
                    list.innerHTML = '';
                    chapters.forEach(c => {
                        const li = document.createElement('li');
                        li.className = 'flex justify-between items-center hover:bg-white/5 p-3 rounded';
                        li.innerHTML = `<div><strong>#${c.chapterNumber}</strong> - ${c.title}</div><div><a href="#" class="text-primary">اقرأ</a></div>`;
                        list.appendChild(li);
                    });
                }

                // comments
                loadComments();

                // auth and favorite state
                const cur = await (await fetch('/auth/current_user')).json();
                if (cur.isLoggedIn) {
                    // show avatar or change fav button text
                    const favBtn = document.getElementById('fav-btn');
                    // check if favorite
                    const profile = await (await fetch('/user/dashboard')).json();
                    const isFav = profile.favorites && profile.favorites.some(f => f._id === id || f === id);
                    favBtn.textContent = isFav ? 'إزالة من المفضلة' : 'أضف للمفضلة';
                    favBtn.addEventListener('click', async () => {
                        const resp = await fetch('/user/favorites/' + id, { method: 'PUT' });
                        if (resp.ok) {
                            const favs = await resp.json();
                            favBtn.textContent = favs.includes(id) ? 'إزالة من المفضلة' : 'أضف للمفضلة';
                            favBtn.classList.add('animate-pulse');
                            setTimeout(() => favBtn.classList.remove('animate-pulse'), 500);
                        } else {
                            favBtn.textContent = '❌ خطأ في تحديث المفضلة';
                        }
                    });
                } else {
                    document.getElementById('comment-form-wrap').innerHTML = '<p class="text-gray-400">سجل الدخول للتعليق أو إضافة للمفضلة</p>';
                }

            } catch (err) {
                console.error(err);
                document.getElementById('manga-root').innerHTML = '<p class="text-center text-red-500">تعذر تحميل البيانات</p>';
            }
        }

        async function loadComments() {
            try {
                const resp = await fetch('/comments?mangaId=' + id);
                if (!resp.ok) return;
                const comments = await resp.json();
                const list = document.getElementById('comments-list');
                list.innerHTML = '';
                comments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'border-t border-gray-800 pt-3';
                    div.innerHTML = `<div class="flex items-center gap-3"><img src="${c.userId?.image || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full"><strong>${c.userId?.displayName || 'مستخدم'}</strong></div><p class="mt-2 text-gray-300">${c.content}</p>`;
                    list.appendChild(div);
                });

                // post comment
                document.getElementById('post-comment') && document.getElementById('post-comment').addEventListener('click', async () => {
                    const content = document.getElementById('comment-input').value.trim();
                    if (!content) {
                        document.getElementById('comment-input').classList.add('border-red-500');
                        return;
                    }
                    const res = await fetch('/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content, mangaId: id }) });
                    if (res.ok) {
                        document.getElementById('comment-input').value = '';
                        document.getElementById('comment-input').classList.remove('border-red-500');
                        loadComments();
                    } else {
                        alert('❌ فشل نشر التعليق');
                    }
                });

            } catch (err) {
                console.error('Comments load error', err);
            }
        }

        if (id) loadManga(); else document.getElementById('manga-root').innerHTML = '<p class="text-center text-gray-400">لم يتم تحديد المعرف</p>';
    </script>

</body>

</html>
